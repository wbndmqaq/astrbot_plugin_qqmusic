name: astrbot_plugin_qqmusic
display_name: "QQ音乐点歌/解析插件"
short_desc: QQ音乐点歌、MV、排行榜、解析、扫码登录
desc: |
  从 Yunzai qqmusic-plugin 移植而来的 AstrBot 版本。
  支持点歌、歌词、热搜、MV 搜索/播放/下载（点歌卡 🎬 徽标）、排行榜、新歌速递、
  推荐、电台、日推、收藏、歌手/专辑/歌单/评论、QQ 音乐分享卡片与链接自动解析、
  webqr 扫码登录、音质自适配降级、语音/群文件/视频发送、QQ官方大文件分片上传（AstrBot ≥4.27.3）。
  需配合后端API使用（API 由用户自行解决）。
version: v1.7.6
author: wbndm
social_link: https://github.com/wbndmqaq
repo: https://github.com/wbndmqaq/astrbot_plugin_qqmusic
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - dingtalk
  - lark
  - kook
  - discord
  - weixin_oc
category: 工具
